name: Publish

# Every v* tag publishes the CLI (github-bilan) to npm. The tag must match the
# version in packages/cli/package.json and point to a commit on main. A release
# goes out through trusted publishing with provenance, or not at all: npm
# trusts this workflow's OIDC token (the trusted publisher on npmjs.com names
# this repository, publish.yml and the npm environment), and no npm token is
# stored anywhere.
on:
  push:
    tags: ['v*']

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/github-bilan
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          version=$(jq -r .version packages/cli/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match github-bilan $version in packages/cli/package.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
          # npm refuses provenance from a private repository, and signing it
          # would still record the repository in Sigstore's public log first.
          if [ "$PRIVATE_REPOSITORY" != false ]; then
            echo "::error::Provenance needs a public repository; $GITHUB_REPOSITORY is not public."
            exit 1
          fi

      # No pnpm store cache: this job can publish, so its packages come from the
      # registry, not from a store another job saved.
      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Test
        run: pnpm exec turbo run type-check test --filter=github-bilan...

      - name: Build
        run: pnpm exec turbo run build --filter=github-bilan

      - name: Publish
        working-directory: packages/cli
        run: |
          # A prerelease such as 1.0.0-beta.1 goes out under `next`, never as `latest`.
          case "$(jq -r .version package.json)" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          # --provenance fails the publish when signing does; without it pnpm
          # quietly skips provenance. No npm token exists in this job, so the
          # upload authenticates through OIDC or is refused.
          pnpm publish --no-git-checks --provenance --tag "$tag"

      - name: Check npm recorded OIDC and provenance
        run: |
          version=$(jq -r .version packages/cli/package.json)
          meta=$(curl -fsS --retry 6 --retry-delay 10 --retry-all-errors \
            "https://registry.npmjs.org/github-bilan/$version")
          if [ "$(jq -r '._npmUser.trustedPublisher.id // empty' <<<"$meta")" != github ]; then
            echo "::error::github-bilan $version was not published through trusted publishing."
            exit 1
          fi
          if [ -z "$(jq -r '.dist.attestations.provenance.predicateType // empty' <<<"$meta")" ]; then
            echo "::error::github-bilan $version was published without provenance."
            exit 1
          fi
