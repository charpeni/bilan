name: Deploy

# Every push to main that passes CI, and is still main's head when its CI
# finishes, is deployed to Cloudflare with Alchemy (`alchemy.run.ts`, stage
# `prod`), which also applies pending D1 migrations.
# Secrets live on the `production` environment: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, TOKEN_ENCRYPTION_KEY, APP_GITHUB_CLIENT_ID,
# APP_GITHUB_CLIENT_SECRET, and optionally APP_GITHUB_TOKEN (GitHub does not
# allow secret names starting with GITHUB_). Every deploy sets the Workers'
# secrets from them, so they must match what production runs with.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # A CI run can finish after a newer commit's, and an old run can be re-run
  # from the Actions tab: either would deploy an older commit, and its older
  # alchemy.run.ts, over production. Only main's current head is deployed;
  # a newer commit's own run deploys it.
  latest:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Compare with main's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $SHA: main is now at $head, which deploys on its own."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: latest
    if: needs.latest.outputs.current == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bilan.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # No pnpm store cache: this job holds the Cloudflare credentials, so its
      # packages come from the registry, not from a store another job saved.
      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Build workspace packages
        run: pnpm exec turbo run build --filter=@bilan/web^...

      - name: Deploy
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
        run: pnpm exec alchemy deploy --stage prod --yes --no-input
