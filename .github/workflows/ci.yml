name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, format, type-check, test]
        include:
          - task: lint
            name: Oxlint
            run: pnpm lint
          - task: format
            name: Oxfmt
            run: pnpm format:check
          - task: type-check
            name: TypeScript
            run: pnpm type-check
          - task: test
            name: Tests
            run: pnpm test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: '.nvmrc'
          cache: true

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}
