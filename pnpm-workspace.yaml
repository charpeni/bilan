packages:
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

# Security patches while upstream development tools still pin affected copies.
# Drizzle Kit's legacy loader only uses esbuild's transform API.
overrides:
  undici@7.29.0: 7.29.1
  sharp@0.35.2: 0.35.4
  '@esbuild-kit/core-utils>esbuild': 0.25.12
